<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Dashboard - SkillHub Academy</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .admin-layout {
      display: flex;
      gap: 20px;
      max-width: 1200px;
      margin: 30px auto;
      padding: 0 20px;
    }
    .admin-stats {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 20px;
      margin-bottom: 30px;
    }
    .stat-card {
      background: #ffffff;
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.05);
      text-align: center;
    }
    .stat-card h3 {
      font-size: 28px;
      color: #007bff;
      margin-bottom: 5px;
    }
    .admin-section {
      background: #ffffff;
      padding: 25px;
      border-radius: 12px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.05);
      margin-bottom: 30px;
    }
    .course-table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 15px;
    }
    .course-table th, .course-table td {
      padding: 12px;
      border-bottom: 1px solid #e0e0e0;
      text-align: left;
    }
    .course-table th {
      background-color: #f8f9fa;
      color: #2b3674;
    }
    .delete-btn {
      background-color: #dc3545;
      color: white;
      border: none;
      padding: 6px 12px;
      border-radius: 4px;
      cursor: pointer;
      font-weight: bold;
    }
    .delete-btn:hover {
      background-color: #bd2130;
    }
  </style>
</head>
<body>

  <!-- Navbar -->
  <header class="navbar">
    <!-- Brand Logo -->
    <a href="index.html" class="logo">
      <span class="logo-icon">🎓</span> 
      <span class="logo-text">Skill<span class="logo-highlight">Hub</span></span>
    </a>

    <div style="display: flex; align-items: center; gap: 15px;">
      <a href="dashboard.html" style="color: #007bff; text-decoration: none; font-weight: bold;">📊 Student View</a>
      <a href="courses.html" style="color: #007bff; text-decoration: none; font-weight: bold;">📚 Courses</a>
      <button onclick="toggleTheme()" class="theme-toggle-btn" id="theme-btn">🌙 Dark Mode</button>
      <a href="login.html" onclick="localStorage.clear();" style="color: #dc3545; text-decoration: none; font-weight: bold;">🚪 Logout</a>
    </div>
  </header>

  <div style="max-width: 1200px; margin: 30px auto; padding: 0 20px;">
    <h2>🛠 Admin Overview</h2>
    <p style="color: #707eae; margin-bottom: 20px;">Manage courses, students, and academy statistics.</p>

    <!-- Stat Cards -->
    <div class="admin-stats">
      <div class="stat-card">
        <h3 id="total-courses-count">4</h3>
        <p>Total Courses</p>
      </div>
      <div class="stat-card">
        <h3>128</h3>
        <p>Enrolled Students</p>
      </div>
      <div class="stat-card">
        <h3>$1,240</h3>
        <p>Total Revenue</p>
      </div>
    </div>

    <!-- Add Course Form -->
    <div class="admin-section">
      <h3>➕ Add New Course</h3>
      <form onsubmit="addNewCourse(event)" style="display: grid; gap: 15px; margin-top: 15px;">
        <input type="text" id="course-title" placeholder="Course Title" required style="padding: 10px; border: 1px solid #ccc; border-radius: 6px;">
        <div style="display: flex; gap: 15px;">
          <input type="text" id="course-category" placeholder="Category (e.g. Web Dev)" style="flex: 1; padding: 10px; border: 1px solid #ccc; border-radius: 6px;">
          <input type="text" id="course-price" placeholder="Price (e.g. $49 or Free)" style="flex: 1; padding: 10px; border: 1px solid #ccc; border-radius: 6px;">
        </div>
        <input type="text" id="course-image" placeholder="Image URL (optional)" style="padding: 10px; border: 1px solid #ccc; border-radius: 6px;">
        <textarea id="course-description" placeholder="Course Description" style="padding: 10px; border: 1px solid #ccc; border-radius: 6px; height: 80px;"></textarea>
        <button type="submit" style="background: #28a745; color: white; border: none; padding: 12px; border-radius: 6px; font-weight: bold; cursor: pointer;">Publish Course</button>
      </form>
    </div>

    <!-- Manage Courses Table -->
    <div class="admin-section">
      <h3>📚 Manage Custom Courses</h3>
      <table class="course-table">
        <thead>
          <tr>
            <th>Title</th>
            <th>Category</th>
            <th>Price</th>
            <th>Action</th>
          </tr>
        </thead>
        <tbody id="admin-course-list">
          <!-- Courses will be loaded dynamically -->
        </tbody>
      </table>
    </div>
  </div>

  <script src="script.js"></script>
  <script>
    // Run Admin Panel Logic on load
    window.addEventListener('DOMContentLoaded', () => {
      if (typeof loadAdminCourses === 'function') {
        loadAdminCourses();
      }
    });
  </script>
</body>
</html>
