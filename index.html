<!DOCTYPE html>
<html lang="am">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Course Player - SkillHub Academy</title>
  
  <!-- html2pdf Library ( -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
  
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Navbar -->
  <header class="navbar">
    <div style="display: flex; align-items: center; gap: 20px;">
      <!-- Brand Logo -->
      <a href="index.html" class="logo">
        <span class="logo-icon">🎓</span> 
        <span class="logo-text">Skill<span class="logo-highlight">Hub</span></span>
      </a>
      <a href="courses.html" style="color: #007bff; text-decoration: none; font-weight: bold; font-size: 14px;">← ወደ ኮርሶች ዝርዝር</a>
    </div>

    <div class="user-profile" style="display: flex; align-items: center; gap: 15px;">
      <a href="dashboard.html" style="color: #007bff; text-decoration: none; font-weight: bold;">📊 Dashboard</a>
      <a href="profile.html" style="color: #007bff; text-decoration: none; font-weight: bold;">👤 Profile</a>
      <a href="quiz.html" style="color: #ffc107; text-decoration: none; font-weight: bold;">📝 Quiz</a>
      <a href="login.html" onclick="localStorage.clear();" style="color: #dc3545; text-decoration: none; font-weight: bold;">🚪 Logout</a>
    </div>
  </header>

  <!-- Main Content Layout -->
  <div class="main-container">
    
    <!-- Video & PDF Display Section -->
    <main class="video-section">
      
      <!-- Video and PDF Switcher Buttons -->
      <div class="tabs">
        <button id="btn-video" class="tab-btn active-tab" onclick="switchTab('video')">📹 Video ማየት</button>
        <button id="btn-pdf" class="tab-btn" onclick="switchTab('pdf')">📄 PDF Readme ማየት</button>
        <button onclick="toggleTheme()" class="theme-btn" id="theme-btn">🌙 Dark Mode</button>
        <button class="cert-btn" onclick="downloadCertificate('Full-Stack Web Development')" style="background-color: #28a745; color: white; border: none; padding: 8px 12px; border-radius: 6px; cursor: pointer; font-weight: bold;">
          🎓 Certificate 
        </button>
      </div>

      <!-- Video Display Area -->
      <div id="video-box" class="media-box">
        <video id="video-player" controls style="width: 100%;">
          <source id="video-source" src="https://www.w3schools.com/html/mov_bbb.mp4" type="video/mp4">
        </video>
      </div>

      <!-- PDF Display Area -->
      <div id="pdf-box" class="media-box" style="display: none;">
        <iframe id="pdf-player" src="https://www.w3.org/WAI/ER/tests/xhtml/testfiles/resources/pdf/dummy.pdf" width="100%" height="450px"></iframe>
      </div>

      <h1 id="lesson-title">1. HTML & CSS </h1>
      <button id="complete-btn" onclick="markCompleted()" style="background-color: #007bff; color: white; border: none; padding: 10px 18px; border-radius: 6px; font-weight: bold; cursor: pointer; margin-top: 10px;">
         (Mark as Completed)
      </button>
    </main>

    <!-- Sidebar / Course Playlist -->
    <aside class="sidebar">
      <h3>Course Outline (Lessons)</h3>
      <ul id="lesson-list">
        <li class="lesson-item active" onclick="changeLesson('1. HTML & CSS መሰረታዊ ትምህርት', 'https://www.w3schools.com/html/mov_bbb.mp4', 'https://www.w3.org/WAI/ER/tests/xhtml/testfiles/resources/pdf/dummy.pdf', this)">
          <span>1. HTML & CSS </span>
          <small>Video & PDF</small>
        </li>
        <li class="lesson-item" onclick="changeLesson('2. JavaScript መሰረታዊ ነገሮች', 'https://interactive-examples.mdn.mozilla.net/media/cc0-videos/flower.mp4', 'https://www.orimi.com/pdf-test.pdf', this)">
          <span>2. JavaScript </span>
          <small>Video & PDF</small>
        </li>
      </ul>
    </aside>

  </div>

  <script src="script.js"></script>
</body>
</html>
