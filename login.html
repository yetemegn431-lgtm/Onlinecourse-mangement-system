<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - SkillHub Academy</title>
  <link rel="stylesheet" href="style.css">
  <style>
    body {
      background-color: #f4f7fe;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      font-family: Arial, sans-serif;
    }
    .auth-brand {
      margin-bottom: 25px;
      text-align: center;
    }
    .auth-card {
      background: #ffffff;
      padding: 35px;
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.08);
      width: 100%;
      max-width: 400px;
    }
    .auth-card h2 {
      margin-bottom: 8px;
      color: #2b3674;
      text-align: center;
    }
    .auth-card p {
      color: #707eae;
      font-size: 14px;
      text-align: center;
      margin-bottom: 25px;
    }
    .form-group {
      margin-bottom: 18px;
    }
    .form-group label {
      display: block;
      margin-bottom: 6px;
      font-weight: bold;
      color: #2b3674;
      font-size: 14px;
    }
    .form-group input {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid #dce0e5;
      border-radius: 6px;
      box-sizing: border-box;
      outline: none;
    }
    .auth-btn {
      width: 100%;
      background: #007bff;
      color: white;
      border: none;
      padding: 12px;
      border-radius: 6px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 10px;
    }
    .auth-btn:hover {
      background: #0056b3;
    }
    .auth-footer {
      text-align: center;
      margin-top: 20px;
      font-size: 14px;
      color: #707eae;
    }
    .auth-footer a {
      color: #007bff;
      text-decoration: none;
      font-weight: bold;
    }
  </style>
</head>
<body>

  <!-- Top Logo Header -->
  <div class="auth-brand">
    <a href="index.html" class="logo">
      <span class="logo-icon">🎓</span> 
      <span class="logo-text">Skill<span class="logo-highlight">Hub</span></span>
    </a>
  </div>

  <div class="auth-card">
    <h2>🔑 Welcome Back</h2>
    <p>Enter your credentials to access your account</p>

    <form id="loginForm" onsubmit="loginStudent(event)">
      <div class="form-group">
        <label for="login-email">Email Address</label>
        <input type="email" id="login-email" placeholder="student@example.com" required>
      </div>

      <div class="form-group">
        <label for="login-password">Password</label>
        <input type="password" id="login-password" placeholder="••••••••" required>
      </div>

      <button type="submit" class="auth-btn">Login</button>
    </form>

    <div class="auth-footer">
      Don't have an account? <a href="register.html">Register Here</a>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
