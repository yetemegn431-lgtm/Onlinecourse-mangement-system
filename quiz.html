<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Course Quiz - My Academy</title>
  <link rel="stylesheet" href="style.css">
  <style>
    body {
      background-color: #f4f7fe;
      color: #2b3674;
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;
    }
    .navbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 15px 30px;
      background-color: #ffffff;
      box-shadow: 0 2px 5px rgba(0,0,0,0.05);
    }
    .quiz-container {
      max-width: 700px;
      margin: 40px auto;
      background: #ffffff;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.05);
    }
    .question-card {
      margin-bottom: 25px;
      padding-bottom: 15px;
      border-bottom: 1px solid #f0f0f0;
    }
    .question-card h3 {
      font-size: 18px;
      color: #007bff;
      margin-bottom: 12px;
    }
    .options-list {
      list-style: none;
      padding: 0;
    }
    .options-list li {
      margin-bottom: 10px;
    }
    .options-list label {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px;
      border: 1px solid #e0e0e0;
      border-radius: 6px;
      cursor: pointer;
      transition: 0.2s;
    }
    .options-list label:hover {
      background-color: #f8f9fa;
    }
    .submit-btn {
      width: 100%;
      background-color: #28a745;
      color: white;
      border: none;
      padding: 12px;
      border-radius: 6px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }
    .submit-btn:hover {
      background-color: #218838;
    }
    .result-box {
      margin-top: 20px;
      padding: 15px;
      border-radius: 8px;
      text-align: center;
      display: none;
    }
    .pass {
      background-color: #d4edda;
      color: #155724;
      border: 1px solid #c3e6cb;
    }
    .fail {
      background-color: #f8d7da;
      color: #721c24;
      border: 1px solid #f5c6cb;
    }
  </style>
</head>
<body>

  <!-- Navbar -->
  <header class="navbar">
    <h2>My Academy</h2>
    <div style="display: flex; align-items: center; gap: 15px;">
      <a href="dashboard.html" style="color: #007bff; text-decoration: none; font-weight: bold;">📊 Dashboard</a>
      <a href="profile.html" style="color: #007bff; text-decoration: none; font-weight: bold;">👤 Profile</a>
      <a href="courses.html" style="color: #007bff; text-decoration: none; font-weight: bold;">← Back to Courses</a>
      <a href="login.html" onclick="localStorage.clear();" style="color: #dc3545; text-decoration: none; font-weight: bold;">🚪 Logout</a>
    </div>
  </header>

  <div class="quiz-container">
    <h2>Full-Stack Web Development - Final Quiz</h2>
    <p style="color: #707eae; margin-bottom: 30px;">Test your knowledge to complete the course.</p>

    <form id="quiz-form" onsubmit="evaluateQuiz(event)">
      <!-- Question 1 -->
      <div class="question-card">
        <h3>1. HTML አህጽሮተ ቃል ትክክለኛ ፍቺ የትኛው ነው?</h3>
        <ul class="options-list">
          <li><label><input type="radio" name="q1" value="A" required> Hyper Text Markup Language</label></li>
          <li><label><input type="radio" name="q1" value="B"> High Tech Modern Language</label></li>
          <li><label><input type="radio" name="q1" value="C"> Hyper Transfer Method Link</label></li>
        </ul>
      </div>

      <!-- Question 2 -->
      <div class="question-card">
        <h3>2. የዌብሳይት Design እና Style ለመስራት የሚያገለግለው የትኛው ነው?</h3>
        <ul class="options-list">
          <li><label><input type="radio" name="q2" value="A" required> HTML</label></li>
          <li><label><input type="radio" name="q2" value="B"> CSS</label></li>
          <li><label><input type="radio" name="q2" value="C"> Python</label></li>
        </ul>
      </div>

      <!-- Question 3 -->
      <div class="question-card">
        <h3>3. በ JavaScript ውስጥ Variable ለመፍጠር የሚያገለግለው የትኛው ነው?</h3>
        <ul class="options-list">
          <li><label><input type="radio" name="q3" value="A" required> var / let / const</label></li>
          <li><label><input type="radio" name="q3" value="B"> makevar</label></li>
          <li><label><input type="radio" name="q3" value="C"> create</label></li>
        </ul>
      </div>

      <button type="submit" class="submit-btn">Submit Quiz</button>
    </form>

    <div id="result-box" class="result-box"></div>
  </div>

  <script src="script.js"></script>
  <script>
    function evaluateQuiz(event) {
      event.preventDefault();

      // Correct answers
      const answers = { q1: 'A', q2: 'B', q3: 'A' };
      let score = 0;

      const q1Val = document.querySelector('input[name="q1"]:checked')?.value;
      const q2Val = document.querySelector('input[name="q2"]:checked')?.value;
      const q3Val = document.querySelector('input[name="q3"]:checked')?.value;

      if (q1Val === answers.q1) score++;
      if (q2Val === answers.q2) score++;
      if (q3Val === answers.q3) score++;

      const percentage = Math.round((score / 3) * 100);
      const resultBox = document.getElementById('result-box');
      resultBox.style.display = 'block';

      if (percentage >= 60) {
        resultBox.className = 'result-box pass';
        resultBox.innerHTML = `
          <h3>🎉 Congratulations!</h3>
          <p>You scored <strong>${percentage}%</strong> (${score}/3). You passed the quiz!</p>
          <a href="dashboard.html" style="color: #155724; font-weight: bold; text-decoration: underline;">Go to Dashboard to Download Certificate</a>
        `;
      } else {
        resultBox.className = 'result-box fail';
        resultBox.innerHTML = `
          <h3>❌ Try Again!</h3>
          <p>You scored <strong>${percentage}%</strong> (${score}/3). You need at least 60% to pass.</p>
        `;
      }
    }
  </script>
</body>
</html>
